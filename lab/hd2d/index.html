<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
		<title>Mystic Woods · Reimagined (HD-2D lab)</title>
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: #000000;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}
		</style>
		<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>
<style>
/* Mystic Woods HD on the iPad: holding the sword button for the spin is a long
   press, and Safari answers a long press with a text selection or a callout, and
   a tap with a grey flash. The page is a game: nothing on it is ever selected. */
html, body, #canvas, #status {
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
}
</style>
<style>
/* Mystic Woods HD while it loads: the title's own MYSTIC WOODS on black, just
   where the title draws it (place() below), its bronze rule burning with ember
   light as the files come in, and once they are all here, sparks rising off it
   while the engine starts. The engine holds the page as it starts, seconds on
   an iPad, and only animations of transform and opacity keep moving through
   that. The game's first frame is then the same logo on the same black, and
   the glade comes up round it (TitleScreen). */
#status { background-color: #000; }
#status-progress { display: none !important; }
#status-splash { position: absolute; margin: 0; right: auto; bottom: auto; max-width: none; max-height: none;
  object-fit: fill; image-rendering: pixelated; }
.mw-rule { position: absolute; pointer-events: none; }
.mw-ember { position: absolute; left: 0; top: 0; width: 100%; height: 100%; transform-origin: 0 50%;
  transform: scaleX(0); transition: transform 0.3s linear;
  background: linear-gradient(90deg, #4a1006, #b8360f 35%, #ff7a1e 80%, #ffd890);
  box-shadow: 0 0 1.5em 0.2em rgba(255, 96, 24, 0.55); }
.mw-spark { position: absolute; bottom: 0; width: 1em; height: 1em; opacity: 0; }
#status.mw-kindled .mw-ember { animation: mw-breathe 1.3s ease-in-out infinite alternate; }
#status.mw-kindled .mw-spark { animation: mw-rise-a 2.4s linear infinite; }
#status.mw-kindled .mw-spark.b { animation-name: mw-rise-b; }
#status.mw-kindled .mw-spark.c { animation-name: mw-rise-c; }
@keyframes mw-breathe { from { opacity: 1; } to { opacity: 0.62; } }
@keyframes mw-rise-a { 0% { opacity: 0; transform: translate(0, 0); } 10% { opacity: 1; }
  100% { opacity: 0; transform: translate(-2em, -22em); } }
@keyframes mw-rise-b { 0% { opacity: 0; transform: translate(0, 0); } 10% { opacity: 1; }
  100% { opacity: 0; transform: translate(3em, -30em); } }
@keyframes mw-rise-c { 0% { opacity: 0; transform: translate(0, 0); } 10% { opacity: 0.9; }
  100% { opacity: 0; transform: translate(0.5em, -16em); } }
@media (prefers-reduced-motion: reduce) { #status.mw-kindled .mw-spark { animation: none; } }
</style>
<style>
/* When the iPad throws the game's graphics away (the script at the end): the
   page goes black under a bronze line while it reloads into the journey, or
   asks for a tap when it already reloaded a moment ago. */
.mw-lost { position: fixed; inset: 0; z-index: 10; display: flex; align-items: center; justify-content: center;
  background: #000; color: #d9b77a; font: 600 20px/1.4 Georgia, 'Times New Roman', serif; letter-spacing: 0.08em;
  text-align: center; padding: 0 16px; }
</style>
<script>
/* Where the title draws its logo (TitleScreen._build_logo): centred, its top
   13% of the way down, at the most whole game pixels to an art pixel that fit
   62% of the game's width; and the game's pixels are the window's under
   canvas_items stretch with expand aspect from 1280 x 720 (project.godot).
   The rule runs along the logo's row 27 from column 14 to 182
   (tools/build_title.py). tools/boot_web_check.mjs holds the two together. */
addEventListener('DOMContentLoaded', function () {
  var status = document.getElementById('status');
  var splash = document.getElementById('status-splash');
  var bar = document.getElementById('status-progress');
  if (!status || !splash || !bar) return;
  var LOGO_W = 196, LOGO_H = 33, RULE_X0 = 14, RULE_X1 = 182, RULE_Y = 27;
  /* Each spark: how far along the rule, its path, its heat, when it starts
     and how long it rises (s). */
  var SPARKS = [[0.04, 'a', '#ffd68c', 0, 2.4], [0.13, 'c', '#d65c1e', 0.7, 2.0], [0.22, 'b', '#ffac4a', 1.3, 2.8],
    [0.31, 'a', '#d65c1e', 0.4, 2.2], [0.42, 'c', '#ffac4a', 1.6, 2.0], [0.5, 'b', '#ffd68c', 0.9, 2.6],
    [0.58, 'a', '#ffac4a', 0.2, 2.4], [0.67, 'c', '#d65c1e', 1.1, 2.1], [0.76, 'b', '#ffd68c', 0.6, 2.7],
    [0.85, 'a', '#ffac4a', 1.4, 2.3], [0.93, 'c', '#d65c1e', 0.3, 2.0], [0.99, 'b', '#ffac4a', 1.0, 2.5]];
  var rule = document.createElement('div');
  rule.className = 'mw-rule';
  var ember = document.createElement('div');
  ember.className = 'mw-ember';
  rule.appendChild(ember);
  SPARKS.forEach(function (sp) {
    var spark = document.createElement('i');
    spark.className = 'mw-spark ' + sp[1];
    spark.style.left = sp[0] * 100 + '%';
    spark.style.background = sp[2];
    spark.style.boxShadow = '0 0 1.5em 0.2em ' + sp[2];
    spark.style.animationDelay = sp[3] + 's';
    spark.style.animationDuration = sp[4] + 's';
    rule.appendChild(spark);
  });
  status.appendChild(rule);
  function place() {
    var w = innerWidth, h = innerHeight;
    var s = Math.min(w / 1280, h / 720);
    var scale = Math.min(6, Math.max(1, Math.floor(w / s * 0.62 / LOGO_W)));
    var k = scale * s, left = w / 2 - LOGO_W * k / 2, top = h * 0.13;
    splash.style.left = left + 'px';
    splash.style.top = top + 'px';
    splash.style.width = LOGO_W * k + 'px';
    splash.style.height = LOGO_H * k + 'px';
    rule.style.left = left + RULE_X0 * k + 'px';
    rule.style.top = top + RULE_Y * k + 'px';
    rule.style.width = (RULE_X1 - RULE_X0) * k + 'px';
    rule.style.height = k + 'px';
    rule.style.fontSize = k + 'px';
  }
  /* The loader counts a file into its total only once it starts on it, so
     its own share dips as the second begins: the rule burns against the
     whole build's size instead (GODOT_CONFIG, the page's own), never back. */
  var sizes = typeof GODOT_CONFIG !== 'undefined' ? GODOT_CONFIG.fileSizes || {} : {};
  var total = Object.keys(sizes).reduce(function (t, k) { return t + sizes[k]; }, 0);
  var burnt = 0;
  function burn() {
    var p = total > 0 ? bar.value / total : (bar.max > 0 ? bar.value / bar.max : 0);
    burnt = Math.max(burnt, Math.min(1, p));
    ember.style.transform = 'scaleX(' + burnt + ')';
    if (burnt >= 1) status.classList.add('mw-kindled');
  }
  place();
  burn();
  addEventListener('resize', place);
  new MutationObserver(burn).observe(bar, { attributes: true });
});
</script>
<script>
/* The iPad may throw the game's WebGL context away when its graphics run
   short, most often just after a map change (Steve #1385). Godot's page then
   stops on an alert ('WebGL context lost, please reload the page') and the
   game can never draw again. This hears the loss first (on the window,
   capturing, ahead of the canvas's own listener), keeps the alert away and
   reloads the page into the journey: the game finds hdResume in the tab's
   sessionStorage and opens on the kept journey's own place with no title
   (Journey.resuming). hdResume carries how many times this tab has lost the
   graphics, and from the second the game draws at its LOW tier. The game
   keeps the journey as each map change begins and on every flag, rune,
   heart and arrival, mirrored into localStorage at once, so a reload loses
   only the steps since. No preventDefault: Godot can't take a restored
   context back, so it stays lost until the reload. A second loss within
   RELOAD_GAP_MS of a reload waits for a tap instead, so a device that can't
   hold the game never reloads in a loop, and a hidden page waits until it
   shows again. tools/lost_web_check.mjs proves it. */
(function () {
  var RELOAD_GAP_MS = 60000;
  function keep(key, value) { try { sessionStorage.setItem(key, value); } catch (e) {} }
  function kept(key) { try { return sessionStorage.getItem(key); } catch (e) { return null; } }
  function reload() {
    keep('hdResume', kept('hdLosses') || '1');
    keep('hdReloadedAt', String(Date.now()));
    location.reload();
  }
  addEventListener('webglcontextlost', function (ev) {
    if (!(ev.target instanceof HTMLCanvasElement)) return;
    ev.stopPropagation();
    keep('hdLosses', String(Number(kept('hdLosses') || 0) + 1));
    var again = Date.now() - Number(kept('hdReloadedAt') || 0) < RELOAD_GAP_MS;
    console.log('PAGE lost the WebGL context, ' + (again ? 'waiting for a tap' : 'reloading into the journey'));
    var note = document.createElement('div');
    note.className = 'mw-lost';
    note.textContent = again ? 'Tap to pick up where you left off' : 'Picking up where you left off';
    document.body.appendChild(note);
    if (again) {
      note.addEventListener('pointerup', reload);
    } else if (document.hidden) {
      addEventListener('visibilitychange', function () { if (!document.hidden) reload(); });
    } else {
      setTimeout(reload, 400);
    }
  }, true);
})();
</script>
	</head>
	<body>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<div id="status">
			<img id="status-splash" class="show-image--true fullsize--false use-filter--false" src="index.png" alt="">
			<progress id="status-progress"></progress>
			<div id="status-notice"></div>
		</div>

		<script src="index.js"></script>
		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":11179020,"index.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
	</body>
</html>
