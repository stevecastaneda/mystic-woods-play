		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: #242424;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}

<script>
/* Mystic Woods HD (scripts/kit/web_loops.gd): loops without a gap on the web, and
   lockstep pairs that stay in step. Godot loops a Web Audio sample by restarting
   it when it ends, leaving a few milliseconds of silence at every seam. The game
   declares each loop's length in seconds (window.hdLoops.add); a buffer of that
   length then loops natively, once the few frames at its start that the engine
   rendered with nothing before them are healed from the loop's end. Loops of a
   length put on one clock (window.hdLoops.together) start on an exact sample a
   moment ahead, at the offset that keeps them in step with the others of that
   length still playing, however far apart the browser got round to each start. */
(function () {
  var seconds = [], clocks = [], LEAD = 0.1;
  window.hdLoops = {
    add: function (s) { if (seconds.indexOf(s) < 0) seconds.push(s); },
    together: function (s) {
      clocks = clocks.filter(function (c) { return c.seconds !== s; });
      clocks.push({ seconds: s, origin: 0, playing: 0, joined: 0 });
    },
    declared: seconds, looped: 0, clocks: function () { return clocks; }
  };
  function matches(b, s) { return Math.abs(b.length - s * b.sampleRate) <= 1.5; }
  function declared(b) {
    for (var i = 0; i < seconds.length; i++) { if (matches(b, seconds[i])) return true; }
    return false;
  }
  function clockFor(b) {
    for (var i = 0; i < clocks.length; i++) { if (matches(b, clocks[i].seconds)) return clocks[i]; }
    return null;
  }
  function heal(b) {
    var n = b.length, k = 8, xs = [-2, -1, k, k + 1];
    for (var c = 0; c < b.numberOfChannels; c++) {
      var d = b.getChannelData(c), ys = [d[n - 2], d[n - 1], d[k], d[k + 1]];
      for (var i = 0; i < k; i++) {
        var v = 0;
        for (var j = 0; j < 4; j++) {
          var w = ys[j];
          for (var m = 0; m < 4; m++) { if (m !== j) w *= (i - xs[m]) / (xs[j] - xs[m]); }
          v += w;
        }
        d[i] = v;
      }
    }
  }
  var start = AudioBufferSourceNode.prototype.start;
  AudioBufferSourceNode.prototype.start = function (when, offset) {
    var b = this.buffer, ctx = this.context;
    if (!b || this.loop || b.length <= 4096 || !declared(b)) return start.apply(this, arguments);
    heal(b);
    this.loop = true;
    window.hdLoops.looped++;
    var clock = clockFor(b);
    if (!clock || b.sampleRate !== ctx.sampleRate) return start.apply(this, arguments);
    var n = b.length, rate = b.sampleRate, from;
    var at = Math.ceil(Math.max(when || 0, ctx.currentTime + LEAD) * rate);
    if (clock.playing > 0) {
      from = ((at - clock.origin) % n + n) % n;
    } else {
      from = Math.round((offset || 0) * rate) % n;
      clock.origin = at - from;
    }
    clock.playing++;
    clock.joined++;
    this.addEventListener('ended', function () { clock.playing--; });
    return start.call(this, at / rate, from / rate);
  };
})();
</script>

	<body>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<div id="status">
			<img id="status-splash" class="show-image--true fullsize--true use-filter--true" src="index.png" alt="">
			<progress id="status-progress"></progress>
			<div id="status-notice"></div>
		</div>

		<script src="index.js"></script>
		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":46241900,"index.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
	</body>
</html>
